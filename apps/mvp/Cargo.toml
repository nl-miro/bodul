[package]
name = "mvp"
version = "0.1.0"
edition = "2024"

[dependencies]
bodul-html-extractor = { path = "../../../bodul-html-extractor/lib/bodul-html-extractor" }
retailers_shopify = { path = "../../../bodul-html-extractor/retailers_shopify" }
development = { path = "../../../bodul-html-extractor/development" }
retailer-sourcing = { path = "../../lib/retailer-sourcing" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
diesel = { version = "2", features = ["chrono", "postgres", "r2d2", "serde_json", "uuid"] }
diesel_migrations = "2"
flate2 = "1"
kernel = { git = "https://github.com/nulllabsdev/mulac", package = "mulac-kernel", tag = "0.3.0" }
kuchiki = "0.8.1"
money = { path = "../../lib/money" }
poem = "3"
quick-xml = "0.40.1"
rand = "0.7.3"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bodul_shared = { version = "0.1.1", registry = "null-labs-hq" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
uuid = { version = "1.23.3", features = ["v4", "v7", "serde"] }
derive-new = "0.7"
strum = { version = "0.27", features = ["derive"] }
regex = "1.12.4"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
