name: Money CI

on:
  pull_request:
    paths:
      - ".github/workflows/money-ci.yml"
      - "lib/money/**"
  push:
    branches:
      - main
      - master
      - "feat/**"
    paths:
      - ".github/workflows/money-ci.yml"
      - "lib/money/**"

permissions:
  contents: read

jobs:
  money:
    name: money crate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lib/money -> lib/money/target

      - name: Check formatting
        run: cargo fmt --manifest-path lib/money/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path lib/money/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path lib/money/Cargo.toml

      - name: Docs
        run: cargo doc --manifest-path lib/money/Cargo.toml --no-deps
