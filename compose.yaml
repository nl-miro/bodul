  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: bodul
      POSTGRES_USER: bodul
      POSTGRES_PASSWORD: bodul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodul -d bodul"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      bodul:
        ipv4_address: 172.28.200.10
    ports:
      - "5432:5432"
    volumes:
      # PG18 image expects the mount at /var/lib/postgresql (data goes in a
      # version subdir), not /var/lib/postgresql/data as in <=17.
      - postgres-data:/var/lib/postgresql

networks:
  bodul:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.200.0/24

volumes:
  postgres-data:
